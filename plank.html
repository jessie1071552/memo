<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プランク記録</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f3;
      --bg-tertiary: #eeece8;
      --text: #1a1a18;
      --text-secondary: #6b6b67;
      --text-tertiary: #9e9e9a;
      --border: rgba(0,0,0,0.12);
      --border-md: rgba(0,0,0,0.22);
      --radius-md: 8px;
      --radius-lg: 12px;
      --green: #0F6E56;
      --green-light: #E1F5EE;
      --green-mid: #1D9E75;
      --green-dark: #085041;
      --green-badge: #9FE1CB;
      --red: #993C1D;
      --red-light: #FAECE7;
      --red-dark: #712B13;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg-secondary: #272725;
        --bg-tertiary: #323230;
        --text: #f0ede8;
        --text-secondary: #a8a8a4;
        --text-tertiary: #6b6b67;
        --border: rgba(255,255,255,0.12);
        --border-md: rgba(255,255,255,0.22);
        --green-light: #04342C;
        --green-badge: #085041;
        --red-light: #4A1B0C;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: var(--bg-tertiary);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--bg);
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
    }

    h1 {
      font-size: 18px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    .tab-row {
      display: flex;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: var(--bg);
      color: var(--text-secondary);
      border: none;
      transition: background 0.15s;
    }
    .tab.active {
      background: var(--bg-secondary);
      color: var(--text);
    }
    .tab:not(:last-child) { border-right: 0.5px solid var(--border-md); }

    .page { display: none; }
    .page.active { display: block; }

    /* タイマー */
    .timer-section { text-align: center; padding: 2rem 0 1rem; }
    .timer-display {
      font-size: 72px;
      font-weight: 500;
      letter-spacing: 3px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 0.75rem;
      color: var(--text);
      transition: color 0.2s;
    }
    .timer-display.running { color: var(--green); }
    .best-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      padding: 4px 14px;
      border: 0.5px solid var(--border);
      border-radius: 20px;
      margin-bottom: 2rem;
    }
    .btn-row { display: flex; gap: 12px; justify-content: center; }
    .btn {
      padding: 13px 28px;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border: 0.5px solid var(--border-md);
      background: var(--bg);
      color: var(--text);
      transition: background 0.15s, transform 0.1s;
      min-width: 110px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { background: var(--bg-secondary); }
    .btn:active { transform: scale(0.97); }
    .btn-stop {
      background: var(--red);
      color: var(--red-light);
      border-color: var(--red-dark);
    }
    .btn-stop:hover { background: var(--red-dark); }
    .saved-flash {
      text-align: center;
      font-size: 13px;
      color: var(--green);
      margin-top: 14px;
      min-height: 20px;
    }

    /* 履歴 */
    .divider { height: 0.5px; background: var(--border); margin: 1rem 0; }
    .records-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .section-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .clear-btn {
      font-size: 12px;
      color: var(--text-tertiary);
      background: none;
      border: none;
      cursor: pointer;
    }
    .clear-btn:hover { color: var(--text-secondary); }
    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border);
      margin-bottom: 6px;
      background: var(--bg);
    }
    .record-item.best {
      border-color: var(--green-mid);
      background: var(--green-light);
    }
    .record-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .record-date { font-size: 13px; color: var(--text-secondary); }
    .record-item.best .record-date { color: var(--green); }
    .record-right { display: flex; align-items: center; gap: 8px; }
    .record-time {
      font-size: 16px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .record-item.best .record-time { color: var(--green-dark); }
    .best-label {
      font-size: 11px;
      background: var(--green-badge);
      color: var(--green-dark);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-tertiary);
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 17px;
      line-height: 1;
      transition: color 0.15s;
      display: flex;
      align-items: center;
    }
    .del-btn:hover { color: var(--red); }
    .empty-state {
      text-align: center;
      padding: 2.5rem 0;
      color: var(--text-tertiary);
      font-size: 14px;
    }
    .empty-state i { font-size: 36px; display: block; margin-bottom: 10px; }

    /* グラフ */
    .graph-page { padding-top: 0.25rem; }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 1.25rem;
    }
    .stat-card {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }
    .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .stat-val {
      font-size: 22px;
      font-weight: 500;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .chart-wrap {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 12px 10px;
      margin-bottom: 1rem;
    }
    .chart-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
  </style>
</head>
<body>
<div class="container">
  <h1><i class="ti ti-flame" style="color:#993C1D;vertical-align:-2px;margin-right:6px;"></i>プランク記録</h1>

  <div class="tab-row">
    <button class="tab active" onclick="switchTab('timer')"><i class="ti ti-player-play"></i> タイマー</button>
    <button class="tab" onclick="switchTab('history')"><i class="ti ti-history"></i> 履歴</button>
    <button class="tab" onclick="switchTab('graph')"><i class="ti ti-chart-line"></i> グラフ</button>
  </div>

  <!-- タイマー -->
  <div class="page active" id="page-timer">
    <div class="timer-section">
      <div class="timer-display" id="display">00:00</div>
      <div class="best-badge">
        <i class="ti ti-trophy" style="font-size:14px;color:#1D9E75;"></i>
        <span id="best-text">記録なし</span>
      </div>
      <div class="btn-row">
        <button class="btn" id="btn-start" onclick="startTimer()">
          <i class="ti ti-player-play"></i> 開始
        </button>
        <button class="btn btn-stop" id="btn-stop" onclick="stopAndSave()" style="display:none">
          <i class="ti ti-player-pause"></i> 停止して保存
        </button>
        <button class="btn" id="btn-reset" onclick="resetTimer()" style="display:none">
          <i class="ti ti-refresh"></i> リセット
        </button>
      </div>
      <div class="saved-flash" id="flash"></div>
    </div>
  </div>

  <!-- 履歴 -->
  <div class="page" id="page-history">
    <div class="divider" style="margin-top:0;"></div>
    <div class="records-header">
      <span class="section-label">記録履歴</span>
      <button class="clear-btn" onclick="clearAll()">全削除</button>
    </div>
    <div id="records-list"></div>
  </div>

  <!-- グラフ -->
  <div class="page graph-page" id="page-graph">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-trophy" style="font-size:12px;"></i> ベスト</div>
        <div class="stat-val" id="stat-best">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-math-avg" style="font-size:12px;"></i> 平均</div>
        <div class="stat-val" id="stat-avg">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-calendar-stats" style="font-size:12px;"></i> 回数</div>
        <div class="stat-val" id="stat-count">0回</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-trending-up" style="font-size:12px;"></i> 先週比</div>
        <div class="stat-val" id="stat-trend">—</div>
      </div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">タイム推移（直近10件）</div>
      <canvas id="lineChart" height="180"></canvas>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">週別ベスト</div>
      <canvas id="barChart" height="160"></canvas>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'plank_records_v1';
let elapsed = 0, startTime = null, interval = null;
let lineChart = null, barChart = null;

function pad(n) { return String(n).padStart(2, '0'); }
function fmt(ms) { const s = Math.floor(ms / 1000); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }

function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch(e) { return []; }
}
function saveRecords(arr) { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }
function getBest(r) { return r.length ? r.reduce((a, b) => a.ms > b.ms ? a : b) : null; }

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) =>
    t.classList.toggle('active', ['timer','history','graph'][i] === tab));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  if (tab === 'graph') renderGraph();
  if (tab === 'history') renderRecords();
}

function startTimer() {
  startTime = Date.now() - elapsed;
  interval = setInterval(() => {
    elapsed = Date.now() - startTime;
    document.getElementById('display').textContent = fmt(elapsed);
    document.getElementById('display').classList.add('running');
  }, 100);
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-stop').style.display = '';
  document.getElementById('btn-reset').style.display = 'none';
  document.getElementById('flash').textContent = '';
}

function stopAndSave() {
  clearInterval(interval);
  document.getElementById('display').classList.remove('running');
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('btn-reset').style.display = '';
  if (elapsed > 0) {
    const records = loadRecords();
    const now = new Date();
    const dateStr = now.getFullYear() + '/' + pad(now.getMonth() + 1) + '/' + pad(now.getDate());
    records.unshift({ ms: elapsed, date: dateStr, ts: Date.now() });
    saveRecords(records);
    renderBest();
    const fl = document.getElementById('flash');
    fl.textContent = fmt(elapsed) + ' を保存しました！';
    setTimeout(() => { fl.textContent = ''; }, 2500);
  }
}

function resetTimer() {
  clearInterval(interval);
  elapsed = 0;
  document.getElementById('display').textContent = '00:00';
  document.getElementById('display').classList.remove('running');
  document.getElementById('btn-start').style.display = '';
  document.getElementById('btn-start').innerHTML = '<i class="ti ti-player-play"></i> 開始';
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('btn-reset').style.display = 'none';
  document.getElementById('flash').textContent = '';
}

function deleteRecord(idx) {
  if (!confirm('この記録を削除しますか？')) return;
  const records = loadRecords();
  records.splice(idx, 1);
  saveRecords(records);
  renderRecords();
  renderBest();
}

function clearAll() {
  if (!confirm('全記録を削除しますか？')) return;
  saveRecords([]);
  renderRecords();
  renderBest();
}

function renderBest() {
  const b = getBest(loadRecords());
  document.getElementById('best-text').textContent = b ? 'ベスト ' + fmt(b.ms) : '記録なし';
}

function renderRecords() {
  const records = loadRecords();
  const best = getBest(records);
  const el = document.getElementById('records-list');
  if (!records.length) {
    el.innerHTML = '<div class="empty-state"><i class="ti ti-history"></i>まだ記録がありません</div>';
    return;
  }
  el.innerHTML = records.map((r, i) => {
    const isBest = r.ms === best.ms;
    return `<div class="record-item${isBest ? ' best' : ''}">
      <div class="record-left">
        <span class="record-date"><i class="ti ti-calendar" style="font-size:13px;vertical-align:-1px;margin-right:4px;"></i>${r.date}</span>
        ${isBest ? '<span class="best-label">🏆 ベスト</span>' : ''}
      </div>
      <div class="record-right">
        <span class="record-time">${fmt(r.ms)}</span>
        <button class="del-btn" onclick="deleteRecord(${i})" aria-label="この記録を削除">
          <i class="ti ti-trash"></i>
        </button>
      </div>
    </div>`;
  }).join('');
}

function renderGraph() {
  const records = loadRecords();
  const best = getBest(records);
  document.getElementById('stat-best').textContent = best ? fmt(best.ms) : '—';
  document.getElementById('stat-count').textContent = records.length + '回';

  if (!records.length) {
    document.getElementById('stat-avg').textContent = '—';
    document.getElementById('stat-trend').textContent = '—';
    if (lineChart) { lineChart.destroy(); lineChart = null; }
    if (barChart) { barChart.destroy(); barChart = null; }
    return;
  }

  const avg = records.reduce((a, b) => a + b.ms, 0) / records.length;
  document.getElementById('stat-avg').textContent = fmt(avg);

  const now = Date.now(), oneWeek = 7 * 24 * 3600 * 1000;
  const tw = records.filter(r => r.ts && (now - r.ts) < oneWeek);
  const lw = records.filter(r => r.ts && (now - r.ts) >= oneWeek && (now - r.ts) < 2 * oneWeek);
  const trendEl = document.getElementById('stat-trend');
  if (tw.length && lw.length) {
    const diff = (tw.reduce((a,b) => a + b.ms, 0) / tw.length) - (lw.reduce((a,b) => a + b.ms, 0) / lw.length);
    trendEl.textContent = (diff >= 0 ? '+' : '') + Math.round(diff / 1000) + 's';
    trendEl.style.color = diff >= 0 ? '#0F6E56' : '#993C1D';
  } else {
    trendEl.textContent = '—';
    trendEl.style.color = '';
  }

  const recent = [...records].slice(0, 10).reverse();
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const textColor = isDark ? '#a8a8a4' : '#6b6b67';
  const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';

  if (lineChart) lineChart.destroy();
  lineChart = new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: {
      labels: recent.map(r => r.date.slice(5)),
      datasets: [{
        data: recent.map(r => Math.round(r.ms / 1000)),
        borderColor: '#1D9E75',
        backgroundColor: 'rgba(29,158,117,0.08)',
        pointBackgroundColor: '#1D9E75',
        pointRadius: 4,
        tension: 0.3,
        fill: true
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ctx.parsed.y + 's' } } },
      scales: {
        x: { ticks: { font: { size: 11 }, color: textColor }, grid: { color: gridColor } },
        y: { ticks: { font: { size: 11 }, color: textColor, callback: v => v + 's' }, grid: { color: gridColor }, beginAtZero: true }
      }
    }
  });

  const weekMap = {};
  records.forEach(r => {
    const d = new Date(r.date.replace(/\//g, '-'));
    const mon = new Date(d);
    mon.setDate(d.getDate() - d.getDay() + 1);
    const key = mon.getFullYear() + '/' + (mon.getMonth() + 1) + '/' + mon.getDate();
    if (!weekMap[key] || weekMap[key] < r.ms) weekMap[key] = r.ms;
  });
  const weekKeys = Object.keys(weekMap).sort().slice(-6);

  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: weekKeys.map(k => k.slice(5) + '~'),
      datasets: [{
        data: weekKeys.map(k => Math.round(weekMap[k] / 1000)),
        backgroundColor: 'rgba(29,158,117,0.6)',
        borderColor: '#1D9E75',
        borderWidth: 1,
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ctx.parsed.y + 's' } } },
      scales: {
        x: { ticks: { font: { size: 11 }, color: textColor }, grid: { display: false } },
        y: { ticks: { font: { size: 11 }, color: textColor, callback: v => v + 's' }, grid: { color: gridColor }, beginAtZero: true }
      }
    }
  });
}

renderBest();
renderRecords();
</script>
</body>
</html>
